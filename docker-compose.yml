# OPTIONAL: this project runs out-of-the-box on the built-in H2 in-memory database,
# so you do NOT need Docker to try it out.
#
# Once you're comfortable and want to practice with a real database (and get closer
# to true per-tenant database routing), uncomment this and switch application.yml's
# datasource block to point at postgres instead of H2.

version: "3.8"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
